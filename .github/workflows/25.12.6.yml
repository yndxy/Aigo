name: 25.12.6

# daed 不编进固件，CI 也不产出任何 ipk/apk。
# 固件只做一件事：把 daed 的运行时依赖备齐（ca-bundle / kmod-sched-core /
# kmod-sched-bpf / kmod-veth / v2ray-geoip / v2ray-geosite + 内核 XDP_SOCKETS），
# 这样以后在设备上 opkg install daed 时依赖检查能通过，不会报错。

on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: 'Static IP address'
        required: false
        default: '192.168.2.1'
        type: string
      OP_author:
        description: 'Build author'
        required: false
        default: 'masaaki'
        type: string
      CUSTOM_PLUGINS:
        description: 'Extra package names separated by spaces'
        required: false
        default: 'luci-app-momo luci-app-adguardhome luci-app-mosdns luci-app-lucky luci-theme-m3e luci-app-vantage luci-app-ttyd luci-app-diskman'
        type: string

permissions:
  contents: write

env:
  DIY_P1_SH: sh/op.sh

jobs:
  build_firmware:
    name: build Aigo AGS21 with kenzok8 daede
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: ["aigo-ags21"]
        source: ["openwrt"]
        include:
          - device: "aigo-ags21"
            config: "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_aigo_ags21=y"

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Free disk space
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: Set variables
      run: |
        TAG="$(date +'%Y%m%d')"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        echo "DEVICE_NAME=${{ matrix.device }}" >> $GITHUB_ENV
        echo "SOURCE_NAME=${{ matrix.source }}" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV

    - name: Clone source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL $SOURCE_NAME
        ln -sf /workdir/$SOURCE_NAME $GITHUB_WORKSPACE/$SOURCE_NAME

    - name: Checkout source tag
      run: |
        cd $SOURCE_NAME
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $_release_tag
            ;;
          *)
            echo "Can't get local/upstream branch or tag"
            exit 1
            ;;
        esac
        echo "release_tag=$_release_tag" >> $GITHUB_ENV

    - name: Restore build cache
      id: build-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ matrix.source }}/dl
          ${{ matrix.source }}/staging_dir
          ${{ matrix.source }}/build_dir/host
          ${{ matrix.source }}/build_dir/hostpkg
          ${{ matrix.source }}/build_dir/toolchain-*
          ${{ matrix.source }}/bin/packages
          ${{ matrix.source }}/bin/targets
        key: ${{ matrix.source }}-${{ matrix.device }}-build-cache-${{ github.run_id }}
        restore-keys: |
          ${{ matrix.source }}-${{ matrix.device }}-build-cache-
          ${{ matrix.source }}-aigo-ags21-build-cache-

    - name: Validate toolchain cache
      run: |
        cd $SOURCE_NAME
        if [ -d staging_dir ] && ! find staging_dir -path '*/toolchain-*/lib/libgcc_s.so.*' | grep -q .; then
          echo "::warning::Restored toolchain cache is incomplete; rebuilding toolchain only."
          rm -rf staging_dir/toolchain-* build_dir/toolchain-* build_dir/target-*/toolchain
          rm -f staging_dir/target-*/pkginfo/toolchain.* staging_dir/target-*/stamp/.toolchain_installed
        fi
        rm -rf dl/go-mod-cache

    - name: Prepare feeds and patches
      run: |
        set -x
        cd $SOURCE_NAME
        [ -d ./staging_dir ] && find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1 || true
        ./scripts/feeds update -a
        cd ..
        [ -e patch ] && cp -rf patch/diy/*.patch $SOURCE_NAME
        [ -e patch ] && cp -rf patch/luci/*.patch $SOURCE_NAME/feeds/luci

    - name: Run common custom script
      run: |
        chmod +x $DIY_P1_SH
        cd $SOURCE_NAME
        $GITHUB_WORKSPACE/$DIY_P1_SH
        cd ..
        [ -e patch ] && cp -rf patch/nginx/luci.locations $SOURCE_NAME/feeds/packages/net/nginx/files-luci-support
        [ -e patch ] && cp -rf patch/nginx/uci.conf.template $SOURCE_NAME/feeds/packages/net/nginx-util/files

    - name: Drop bundled dae/daed packages
      run: |
        rm -rf $SOURCE_NAME/package/porxy/dae $SOURCE_NAME/package/porxy/daed $SOURCE_NAME/package/porxy/luci-app-daede
        rm -rf $SOURCE_NAME/package/porxy/luci-app-daed

    - name: Load Aigo AGS21 config
      run: |
        [ -e files ] && mv files $SOURCE_NAME/files
        rm -f $SOURCE_NAME/files/etc/uci-defaults/98-install-daed-runfiles
        cat <<EOF >>$SOURCE_NAME/.config
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        ${{ matrix.config }}
        EOF

        [ -e config ] && cat config/config-common >> $SOURCE_NAME/.config

        cat <<EOF >>$SOURCE_NAME/.config
        # daed 本体与 LuCI 前端不进固件
        # CONFIG_PACKAGE_daed is not set
        # CONFIG_PACKAGE_dae is not set
        # CONFIG_PACKAGE_luci-app-daede is not set
        # 以下只为“以后 opkg install daed 不报依赖错误”而保留
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_kmod-sched-core=y
        CONFIG_PACKAGE_kmod-sched-bpf=y
        CONFIG_PACKAGE_kmod-veth=y
        CONFIG_PACKAGE_v2ray-geoip=y
        CONFIG_PACKAGE_v2ray-geosite=y
        CONFIG_KERNEL_XDP_SOCKETS=y
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        EOF

        sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" $SOURCE_NAME/package/base-files/files/bin/config_generate

        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          case "$plugin" in
            dae|daed|luci-app-daed|luci-app-daede)
              echo "skip on purpose: $plugin"
              continue
              ;;
          esac
          echo "CONFIG_PACKAGE_${plugin}=y" >> $SOURCE_NAME/.config
        done

    - name: Download package sources
      id: package
      run: |
        cd $SOURCE_NAME
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Verify .config entries
      run: |
        cd ${{ matrix.source }}
        echo "=== device ==="
        grep -E "CONFIG_TARGET_DEVICE.*aigo_ags21" .config || { echo "::error::NOT FOUND: aigo_ags21 config"; exit 1; }
        grep "CONFIG_TARGET_mediatek_filogic=y" .config || { echo "::error::NOT FOUND: mediatek_filogic"; exit 1; }

        echo "=== daed must not be selected ==="
        for s in CONFIG_PACKAGE_daed CONFIG_PACKAGE_dae CONFIG_PACKAGE_luci-app-daede CONFIG_PACKAGE_luci-app-daed; do
          if grep -q "^${s}=y" .config; then echo "::error::$s is selected"; exit 1; fi
        done

        echo "=== runtime deps that must be installed in the image ==="
        miss=0
        for s in CONFIG_PACKAGE_ca-bundle CONFIG_PACKAGE_kmod-sched-core CONFIG_PACKAGE_kmod-sched-bpf CONFIG_PACKAGE_kmod-veth CONFIG_PACKAGE_v2ray-geoip CONFIG_PACKAGE_v2ray-geosite; do
          if grep -q "^${s}=y" .config; then echo "ok: $s"; else echo "::error::not set: $s"; miss=1; fi
        done
        [ $miss -eq 0 ] || exit 1

        echo "=== kernel options ==="
        grep -q '^CONFIG_KERNEL_XDP_SOCKETS=y' .config && echo "ok: KERNEL_XDP_SOCKETS" || { echo "::error::KERNEL_XDP_SOCKETS missing"; exit 1; }
        grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config && echo "ok: KERNEL_DEBUG_INFO_BTF" || echo "::warning::KERNEL_DEBUG_INFO_BTF was dropped by Kconfig (kernel tree may not support BTF)"

    - name: Kernel BPF/BTF report
      run: |
        cd $SOURCE_NAME
        make tools/install -j$(nproc) || yes n | make tools/install -j1 V=s
        make toolchain/install -j$(nproc) || yes n | make toolchain/install -j1 V=s
        make target/compile -j$(nproc) || yes n | make target/compile -j1 V=s
        echo "::group::kernel options daed needs at runtime"
        KCFG=$(ls build_dir/target-*/linux-*/.config 2>/dev/null | head -1)
        echo "kernel config: $KCFG"
        if [ -n "$KCFG" ]; then
          grep -E '^CONFIG_(DEBUG_INFO|DEBUG_INFO_BTF|XDP_SOCKETS|BPF_SYSCALL|CGROUP_BPF|NET_CLS_BPF|NET_SCH_BPF|NET_CLS_ACT|NET_SCH_INGRESS|BPF_JIT)' "$KCFG" || echo "none of the BPF lines present"
        fi
        echo "::endgroup::"

    - name: Compile firmware
      id: compile
      run: |
        cd $SOURCE_NAME
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || yes n | make -j1 || yes n | make -j1 V=s

    - name: Verify image contents
      run: |
        cd $SOURCE_NAME
        mf=$(ls bin/targets/*/*/*.manifest 2>/dev/null | head -1)
        echo "manifest: $mf"
        [ -n "$mf" ] || { echo "::error::no manifest found"; exit 1; }

        echo "=== daed must not be in the image ==="
        if grep -Eq '^(daed|dae|luci-app-daede|luci-app-daed)( |$)' "$mf"; then
          echo "::error::daed leaked into the image"; exit 1
        fi

        echo "=== deps for a later 'opkg install daed' ==="
        miss=0
        for p in ca-bundle kmod-sched-core kmod-sched-bpf kmod-veth v2ray-geoip v2ray-geosite; do
          if grep -Eq "^${p}( |\$)" "$mf"; then echo "ok: $p"; else echo "::error::missing in image: $p"; miss=1; fi
        done
        [ $miss -eq 0 ] || exit 1

    - name: Clean volatile Go module cache
      if: always()
      run: |
        cd $SOURCE_NAME
        rm -rf dl/go-mod-cache

    - name: Save build cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ matrix.source }}/dl
          ${{ matrix.source }}/staging_dir
          ${{ matrix.source }}/build_dir/host
          ${{ matrix.source }}/build_dir/hostpkg
          ${{ matrix.source }}/build_dir/toolchain-*
          ${{ matrix.source }}/bin/packages
          ${{ matrix.source }}/bin/targets
        key: ${{ matrix.source }}-${{ matrix.device }}-build-cache-${{ github.run_id }}

    - name: Show disk usage
      if: (!cancelled())
      run: df -hT

    - name: List built firmware
      if: always()
      run: |
        echo "=== bin/targets content ==="
        find $SOURCE_NAME/bin/targets -maxdepth 3 -type f 2>/dev/null | head -50 || true
        echo "=== .config device lines ==="
        grep -E "TARGET_DEVICE" $SOURCE_NAME/.config | head -20 || true

    - name: Organize firmware
      id: organize
      run: |
        cd $SOURCE_NAME/bin/targets/*/*
        rm -rf packages
        rm -rf *.buildinfo
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *.itb
        rm -rf *bl2.bin
        rm -rf *kernel.bin
        rm -rf *.sha
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware to Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{ env.tag }}-op-ags21
        files: ${{ env.FIRMWARE }}/*
        body: |
          ==================== Firmware Info =======================
          Workflow: op-ags21
          Device: Aigo AGS21
          Branch: ${{ env.release_tag }}
          Static IP: ${{ github.event.inputs.OP_IP }}
          Extra packages: ${{ github.event.inputs.CUSTOM_PLUGINS }}
          daed: NOT bundled. Runtime deps are preinstalled, so `opkg install daed` works later.
          Author: ${{ github.event.inputs.OP_author }}
          Default password: none
